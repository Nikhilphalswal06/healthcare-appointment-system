<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

</head>
<body>

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-heart-pulse"></i></span> MediCare+</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="doctors.html">Find Doctors</a>
      <a href="appointments.html">Appointments</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="navbar-actions">
      <button class="icon-btn theme-toggle" title="Toggle theme"><i class="fa-regular fa-moon"></i></button>
      <a href="notifications.html" class="icon-btn" title="Notifications" style="color:var(--teal-700); border-color:var(--teal-500);"><i class="fa-solid fa-bell"></i></a>
      <div data-auth="guest" style="display:flex; gap:10px;">
        <a href="login.html" class="btn btn-ghost btn-sm">Login</a>
        <a href="register.html" class="btn btn-primary btn-sm">Register</a>
      </div>
      <a href="patient-dashboard.html" data-auth="user" class="user-chip" style="display:none;">
        <img class="avatar user-chip-avatar" src="" alt="Profile" width="30" height="30">
        <span class="user-chip-name">Account</span>
      </a>
    </div>
    <button class="hamburger" aria-label="Open menu"><span></span></button>
  </div>
</header>
<div class="drawer-overlay"></div>
<aside class="mobile-drawer">
  <button class="drawer-close btn-icon"><i class="fa-solid fa-xmark"></i></button>
  <a href="index.html">Home</a>
  <a href="doctors.html">Find Doctors</a>
  <a href="appointments.html">Appointments</a>

  <a href="contact.html">Contact</a>
</aside>

<main>
  <div class="container" style="max-width:760px; padding: 40px 24px 80px;">
    <div class="dash-topbar">
      <div>
        <h1>Notifications</h1>
        <p><span id="unreadCount">0</span> unread notifications</p>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-outline btn-sm" id="markAllReadBtn">Mark all as read</button>
        <button class="btn btn-danger-outline btn-sm" id="clearAllBtn">Clear all</button>
      </div>
    </div>

    <div class="card" id="notificationsList"></div>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/notifications.js"></script>

</html>
